<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Camilo Rosero</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous" />
    <style>
        body {
            margin: 0;
            background: #f4f4f4;
            font-family: Arial, Helvetica, sans-serif;
            color: #1d1d1d;
        }

        .profile-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .profile-card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border: 1px solid #d8d8d8;
            border-radius: 18px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
            padding: 24px 24px 20px;
            text-align: center;
        }

        .profile-image {
            width: 170px;
            height: 170px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #d9d9d9;
            display: block;
            margin: 0 auto 18px;
            background: #eeeeee;
        }

        .profile-name {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .profile-role {
            font-size: 1rem;
            color: #5a5a5a;
            margin-bottom: 18px;
        }

        .profile-bio {
            font-size: 0.96rem;
            line-height: 1.7;
            color: #333333;
            margin-bottom: 18px;
        }

        .btn-back {
            display: inline-block;
            padding: 10px 18px;
            border-radius: 8px;
            background: #111111;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
        }

        .avatar-fallback {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            background: #e7e7e7;
            border: 3px solid #d9d9d9;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: #232323;
            font-weight: 700;
            margin: 0 auto 18px;
        }
    </style>
</head>

<body>
    <div class="profile-page">
        <div class="profile-card">
            <img src="./camilo-rosero.jpg" class="profile-image" alt="Camilo Rosero" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
            <div class="avatar-fallback">CR</div>

            <h1 class="profile-name">Camilo Rosero</h1>
            <p class="profile-role">Estudiante 5B</p>
            <p class="profile-bio">
                Me gusta aprender, crear cosas nuevas y mejorar cada día con trabajo en equipo.
            </p>

            <a href="../estudiantes.html" class="btn-back">Volver</a>
        </div>
    </div>
</body>

</html>
